<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Casamento</title>

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ENVELOPE -->
<div class="envelope" onclick="abrirConvite()">
  <div class="tampa"></div>
  <div class="texto-envelope">Toque para abrir 💌</div>
</div>

<!-- CARTA -->
<div class="carta" id="carta">
  <div class="card">
    <h2>Vamos nos casar!</h2>

    <h1>Gabriel & Carolina</h1>
    <div class="rings">&#128141</div>

    <p>
      Uma nova fase se inicia em nossas vidas e queremos você conosco
      para celebrar esse momento especial!
    </p>

    <div class="date">03 de Outubro de 2026 • 18:00</div>

    <p><strong>Local:</strong><br>Benditto Bistrô</p>

    <button class="btn" onclick="confirmarPresenca()">
      Confirmar presença
    </button>

    <a href="https://www.google.com/maps/place/Benditto+Bistr%C3%B4/@-22.7862111,-43.3051091,17z/data=!4m6!3m5!1s0x997b480a0a52b9:0x89f3c1d63de95324!8m2!3d-22.7862111!4d-43.3051091!16s%2Fg%2F11sqx0p073?entry=ttu&g_ep=EgoyMDI2MDMxOC4xIKXMDSoASAFQAw%3D%3D" target="_blank">
      📍 Como chegar
    </a>

    <div class="contador" id="contador"></div>
  </div>
</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
